# Publish the PWA (web/) to GitHub Pages, only if the end-to-end test passes.
#
# 1. scripts/prepare_vendor.py downloads (sha256-checked) the Pyodide runtime,
#    packages (PyMuPDF included) and PyPI wheels into web/vendor/
# 2. tests/e2e_pwa.mjs opens the app in headless Chrome and converts test PDFs:
#    file picker, password, share target, offline, no external requests
# 3. deploy to Pages
#
# One-time prerequisite: Settings -> Pages -> Source: "GitHub Actions".

name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "python/**", "scripts/**", "tests/**", "spike/make_test_pdfs.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare web/vendor
        run: python scripts/prepare_vendor.py

      - name: Generate test PDFs
        run: |
          pip install reportlab numpy opencv-python-headless pymupdf
          python spike/make_test_pdfs.py e2e-pdf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: End-to-end test in headless Chrome
        run: |
          (cd tests && npm install --no-audit --no-fund)
          python -m http.server 8080 --bind 127.0.0.1 --directory web &
          sleep 2
          node tests/e2e_pwa.mjs http://127.0.0.1:8080/ e2e-pdf e2e-docx "$(command -v google-chrome)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-docx
          path: e2e-docx
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
