# Pubblica la PWA (web/) su GitHub Pages, solo se il test end-to-end passa.
#
# 1. scripts/prepara_vendor.py scarica (con verifica sha256) runtime Pyodide,
#    pacchetti (PyMuPDF compreso) e wheel PyPI in web/vendor/
# 2. tests/e2e_pwa.mjs apre l'app in Chrome headless e converte PDF di prova:
#    selettore, password, condivisione, offline, nessuna richiesta esterna
# 3. deploy su Pages
#
# Prerequisito (una volta): Settings -> Pages -> Source: "GitHub Actions".

name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "python/**", "scripts/**", "tests/**", "spike/genera_pdf.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepara web/vendor
        run: python scripts/prepara_vendor.py

      - name: Genera PDF di prova
        run: |
          pip install reportlab numpy opencv-python-headless pymupdf
          python spike/genera_pdf.py e2e-pdf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test end-to-end in Chrome headless
        run: |
          (cd tests && npm install --no-audit --no-fund)
          python -m http.server 8080 --bind 127.0.0.1 --directory web &
          sleep 2
          node tests/e2e_pwa.mjs http://127.0.0.1:8080/ e2e-pdf e2e-docx "$(command -v google-chrome)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-docx
          path: e2e-docx
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
