# Compila PyMuPDF per Pyodide (WebAssembly), lo verifica convertendo PDF veri
# dentro Pyodide e, se richiesto, pubblica la wheel come asset di una release.
#
# Procedura ufficiale PyMuPDF: https://pymupdf.readthedocs.io/en/latest/pyodide.html
# Replica la loro CI notturna (.github/workflows/test_pyodide.yml):
# scripts/test.py --cibw-pyodide 1 cibw  -> cibuildwheel --platform pyodide (cp313).

name: Build PyMuPDF wasm

on:
  workflow_dispatch:
    inputs:
      pymupdf_ref:
        description: "Ref di pymupdf/PyMuPDF (tag, branch o commit)"
        default: "main"
      mupdf_branch:
        description: "Branch di ArtifexSoftware/mupdf (serve una versione con le modifiche rpath per pyodide)"
        default: "1.28.x"
      pyodide_version:
        description: "Versione Pyodide: DEVE coincidere con quella della PWA (web/pyodide-version.txt)"
        default: "0.28.3"
      publish:
        description: "Pubblica la wheel come release GitHub"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      wheel: ${{ steps.wheel.outputs.name }}
      pymupdf_sha: ${{ steps.src.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pymupdf/PyMuPDF
          ref: ${{ inputs.pymupdf_ref }}
          path: pymupdf-src

      - id: src
        run: echo "sha=$(git -C pymupdf-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compila wheel pyodide
        working-directory: pymupdf-src
        run: >
          python scripts/test.py
          -m "git:--branch ${{ inputs.mupdf_branch }} https://github.com/ArtifexSoftware/mupdf"
          --cibw-pyodide 1
          --cibw-pyodide-version "${{ inputs.pyodide_version }}"
          -e CIBW_TEST_COMMAND=
          cibw

      - id: wheel
        run: |
          ls -l pymupdf-src/wheelhouse/
          name=$(basename "$(ls pymupdf-src/wheelhouse/*pyodide*wasm32.whl pymupdf-src/wheelhouse/*emscripten*wasm32.whl 2>/dev/null | head -1)")
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pymupdf-wasm
          path: pymupdf-src/wheelhouse/${{ steps.wheel.outputs.name }}
          if-no-files-found: error

  smoke:
    # Conversione reale dentro Pyodide: stessa catena che userà la PWA.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pymupdf-wasm
          path: wheelhouse

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera PDF di prova
        run: |
          pip install reportlab numpy opencv-python-headless
          python spike/genera_pdf.py smoke-pdf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa pyodide per Node
        working-directory: tests
        run: npm install --no-audit --no-fund "pyodide@${{ inputs.pyodide_version }}"

      - name: Converte i PDF dentro Pyodide
        run: |
          python -m http.server 8765 --directory wheelhouse &
          sleep 2
          node tests/smoke_pyodide.mjs \
            "http://127.0.0.1:8765/${{ needs.build.outputs.wheel }}" \
            smoke-pdf smoke-docx python

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-docx
          path: smoke-docx
          if-no-files-found: ignore

  release:
    needs: [build, smoke]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pymupdf-wasm
          path: wheelhouse

      - name: Crea release con la wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pymupdf-wasm-pyodide-${{ inputs.pyodide_version }}-${{ github.run_number }}"
          gh release create "$tag" wheelhouse/*.whl \
            --repo "${{ github.repository }}" \
            --title "PyMuPDF wasm per Pyodide ${{ inputs.pyodide_version }}" \
            --notes "PyMuPDF ${{ inputs.pymupdf_ref }} (commit ${{ needs.build.outputs.pymupdf_sha }}), MuPDF ${{ inputs.mupdf_branch }}, Pyodide ${{ inputs.pyodide_version }}. Licenza AGPL-3.0 (Artifex). Verificata dallo smoke test del run ${{ github.run_id }}."
