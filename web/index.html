<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self'; img-src 'self' blob: data:; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f4e8c">
  <meta name="description" content="Convert PDF to editable Word on your device. The file is never uploaded to a server.">
  <title>PDF to Word</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/precache.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="app.title">PDF to Word</h1>
      <p class="subtitle" data-i18n="app.subtitle"></p>
    </header>

    <section id="engine" class="card" aria-live="polite">
      <div class="row">
        <span class="light" id="engine-light" data-state="loading"></span>
        <span id="engine-text" data-i18n="engine.preparing"></span>
      </div>
      <p class="note" id="engine-note" data-i18n="engine.firstRun" hidden></p>
    </section>

    <section class="card">
      <label class="button primary" id="choose" aria-disabled="true">
        <input type="file" id="file" accept="application/pdf,.pdf" disabled>
        <span data-i18n="file.choose">Choose PDF</span>
      </label>
      <p class="file-name" id="file-name" hidden></p>

      <form id="password-form" hidden>
        <label for="password" id="password-label" data-i18n="password.label"></label>
        <div class="row">
          <input type="password" id="password" autocomplete="off" required>
          <button type="submit" class="button" data-i18n="password.unlock"></button>
        </div>
      </form>

      <div id="progress" hidden>
        <progress id="bar" max="100" value="0"></progress>
        <p id="progress-text" aria-live="polite"></p>
      </div>

      <div id="result" hidden>
        <p id="result-text"></p>
        <div class="actions">
          <a class="button primary" id="download" download data-i18n="result.download"></a>
          <button type="button" class="button" id="share" data-i18n="result.openWith" hidden></button>
        </div>
        <p class="note" data-i18n="result.tip"></p>
      </div>

      <p class="error" id="error" role="alert" hidden></p>

      <div id="diag-area" hidden>
        <button type="button" class="link-button" id="diag-button" data-i18n="diag.button"></button>
        <div id="diag" hidden>
          <p class="note" data-i18n="diag.note"></p>
          <textarea id="diag-text" readonly rows="8" spellcheck="false"></textarea>
          <button type="button" class="button" id="diag-copy" data-i18n="diag.copy"></button>
        </div>
      </div>
    </section>

    <footer>
      <p data-i18n="footer.digital"></p>
      <p><span data-i18n="footer.privacy"></span> <a href="https://github.com/DaniMeri02/pdf2word-local" rel="noreferrer" data-i18n="footer.source"></a> (AGPL-3.0).</p>
      <p id="build"></p>
    </footer>
  </main>
</body>
</html>
